# Lightspeed - example config. Design yours on the page (lightspeed/lightspeed.html)
# and press Save, or edit this file. Colours are rrggbb without '#'.
# Full reference: docs/CONTRACT.md

[lightspeed]
brightness: 0.6

# A Klipper neopixel chain, e.g. Stealthburner logo + nozzle LEDs
#[lightspeed strip hotend]
#output: neopixel hotend_rgb
#leds: 1-3
#place: toolhead_logo

# An ESP32 running WLED over Wi-Fi: no load on the printer's MCUs at all
#[lightspeed strip case]
#output: wled 192.168.1.60
#count: 60
#place: top_ring

# Without scene sections every strip uses the built-in scenes:
#   idle blue breathing, heating red bar, homing green scan, probing purple scan,
#   printing white, paused orange breathing, complete green breathing, error red blink.

#[lightspeed scene idle]
#all: breathe color=1a3cff color2=000814 period=4
#case: rainbow period=8

#[lightspeed scene printing]
#hotend: solid color=ffffff
#case: progress color=ffffff color2=101010
