# Live demo on GitHub Pages: the page from web/ without a printer (it shows the simulator only).
# Enable Pages once in the repo settings (Source: GitHub Actions); every push to main redeploys it.
name: demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Site from web/
        run: |
          mkdir -p site
          cp -r web/. site/
          cp web/lightspeed.html site/index.html
          rm -f site/_model_preview.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
